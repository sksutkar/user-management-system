<h1 mat-dialog-title class="title">{{data?'Update User':'Add User'}}</h1>
 
<form [formGroup]="registerForm" (ngSubmit)="onFormSubmit()" >

<div mat-dialog-content class="content">

    <div class="row">
        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>Select Department</mat-label>
            <mat-select formControlName="department">
                <mat-option value="IT">IT</mat-option>
                <mat-option value="HR">HR</mat-option>
                <mat-option value="Sales">Sales</mat-option>
                <mat-option value="Accounts">Accounts</mat-option>
                <mat-option value="Management">Management</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>Name</mat-label>
            <input matInput type="text" placeholder="Ex.Enter Your Name" formControlName="name">
        </mat-form-field>

    </div>
    <div class="row">


        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>Mobile</mat-label>
            <input matInput type="text" placeholder="Ex.9359xxxx66" formControlName="mobile">
        </mat-form-field>
        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>Email</mat-label>
            <input matInput type="text" placeholder="Ex.abc@gmail.com" formControlName="email">
        </mat-form-field>

    </div>
    <div class="row">


        <mat-form-field appearance="outline" class="mat-input">
            <mat-label>Select Date</mat-label>
            <input matInput [matDatepicker]="picker" placeholder="Ex.24/25/2026" formControlName="dob">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-radio-group aria-label="Select an option" class="mat-input" formControlName="gender">
             <mat-label>Gender</mat-label>
            <mat-radio-button value="Male">Male</mat-radio-button>
            <mat-radio-button value="Female">Female</mat-radio-button>
        </mat-radio-group>

    </div>
    <div class="row">


        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>Salary</mat-label>
            <input matInput type="text" placeholder="Ex.50000" formControlName="salary">
        </mat-form-field>
        <mat-form-field appearance="outline" class="mat-input" >
            <mat-label>User Code</mat-label>
            <input matInput type="text" placeholder="Ex.7123" formControlName="usercode">
        </mat-form-field>

    </div>

    <div class="row" >
        <section class="example-section"  class="mat-input">
            <mat-checkbox class="example-margin" formControlName="status">Active ?</mat-checkbox>

        </section>
    </div>


</div>

<div mat-dialog-actions style="justify-content: center;" class="action">
    <button mat-raised-button class="btn-cancel" type="button" [matDialogClose]="false">CANCEL</button>
    <button mat-raised-button class="btn-save" type="submit">{{data?'Update':'Save'}}</button>
</div>

</form>
